<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Language - HealthAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-[#030409] text-white font-body overflow-x-hidden">
    <!-- Language Selection Page -->
    <div class="min-h-screen flex flex-col items-center justify-center relative px-6">
        <!-- Background Image with Overlay -->
        <div class="absolute inset-0 z-0">
            <img src="https://static.prod-images.emergentagent.com/jobs/d110c836-116f-4dd2-9d24-7582d44c9b5c/images/f1962ab23165d8afd787dab3e6bfe1f63b1ab29fc135b7d894a2cae4210dad7d.png"
                alt="Background" class="w-full h-full object-cover fixed">
            <div class="absolute inset-0 bg-black/60"></div>
        </div>

        <!-- Content -->
        <div class="relative z-20 fade-in">
            <!-- Heading -->
            <h2 class="text-4xl md:text-5xl tracking-tight font-medium font-heading text-center mb-12">
                Select Your <span class="gradient-text">Language</span>
            </h2>

            <!-- Language Cards Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8 max-w-3xl mx-auto">
                <!-- English Card -->
                <div data-testid="language-english-card" onclick="selectLanguage('English')"
                    class="language-card crystal-glass p-10 md:p-12 rounded-3xl cursor-pointer transform transition-all duration-300 hover:scale-105 hover:shadow-[0_0_30px_rgba(0,102,255,0.4)] group">
                    <div class="text-center">
                        <div class="text-6xl md:text-7xl mb-6">🇬🇧</div>
                        <h3
                            class="text-2xl md:text-3xl font-semibold font-heading group-hover:text-[#0066FF] transition-colors">
                            English
                        </h3>
                    </div>
                </div>

                <!-- Tamil Card -->
                <div data-testid="language-tamil-card" onclick="selectLanguage('Tamil')"
                    class="language-card crystal-glass p-10 md:p-12 rounded-3xl cursor-pointer transform transition-all duration-300 hover:scale-105 hover:shadow-[0_0_30px_rgba(123,44,191,0.4)] group">
                    <div class="text-center">
                        <div class="text-6xl md:text-7xl mb-6">🇮🇳</div>
                        <h3
                            class="text-2xl md:text-3xl font-semibold font-heading group-hover:text-[#7B2CBF] transition-colors">
                            தமிழ்
                        </h3>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
